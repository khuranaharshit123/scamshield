# Add to the EXISTING reverse proxy on the VPS (e.g. /etc/nginx/sites-available/scamshield.conf).
# TLS: Cloudflare Origin Certificate (SSL mode "Full (strict)") or certbot DNS-01 with a Cloudflare token.
limit_req_zone $binary_remote_addr zone=scamshield_api:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name api.yourdomain.in;
    ssl_certificate     /etc/ssl/cloudflare/yourdomain.pem;
    ssl_certificate_key /etc/ssl/cloudflare/yourdomain.key;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    location /admin/ { return 404; }            # admin only via admin.yourdomain.in
    location / {
        limit_req zone=scamshield_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.yourdomain.in;
    ssl_certificate     /etc/ssl/cloudflare/yourdomain.pem;
    ssl_certificate_key /etc/ssl/cloudflare/yourdomain.key;
    # allow 203.0.113.10;  deny all;           # optional: your IP only
    location /admin/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; }
    location / { return 404; }
}
