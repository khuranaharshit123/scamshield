name: backend
on:
  push:
    branches: [main]
    paths: ["backend/**", "sandbox/**", "shared/**", "deploy/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "sandbox/**", "shared/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r backend/requirements-dev.txt pytest
      - run: ruff check backend sandbox tools
        working-directory: .
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m pytest -q -p no:asyncio test_page_analysis.py
        working-directory: sandbox
      - name: Android assets match shared rules
        run: python tools/export_rules.py --check

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    env:
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Build & push images
        run: |
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          for img in api sandbox; do
            df=backend/Dockerfile; [ $img = sandbox ] && df=sandbox/Dockerfile
            docker build -f $df -t ghcr.io/$OWNER_LC/scamshield-$img:${{ github.sha }} -t ghcr.io/$OWNER_LC/scamshield-$img:latest .
            docker push --all-tags ghcr.io/$OWNER_LC/scamshield-$img
          done
      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: deploy/docker-compose.yml
          target: /opt/scamshield
      - name: Deploy on VPS (runs from GitHub, so campus Wi-Fi port blocks don't matter)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            cd /opt/scamshield/deploy
            TAG=${{ github.sha }} docker compose pull
            TAG=${{ github.sha }} docker compose up -d --remove-orphans
            sleep 8
            curl -fsS http://127.0.0.1:8000/v1/health
