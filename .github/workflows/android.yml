name: android
on:
  push:
    branches: [main]
    paths: ["android/**", "shared/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["android/**", "shared/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: android}}
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Assets match shared rules
        working-directory: .
        run: pip install pyyaml && python tools/export_rules.py --check
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env: {KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}"}
        run: echo "$KS" | base64 -d > app/release.keystore
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SCAMSHIELD_API_BASE_URL: ${{ vars.SCAMSHIELD_API_BASE_URL }}
          SCAMSHIELD_API_KEY: ${{ secrets.SCAMSHIELD_API_KEY }}
        run: ./gradlew assembleRelease assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: apks, path: "android/app/build/outputs/apk/**/*.apk"}
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: {files: "android/app/build/outputs/apk/release/*.apk"}
